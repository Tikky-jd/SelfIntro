<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#5b46e0"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- 装饰圆环 -->
  <circle cx="985" cy="150" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="985" cy="150" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="985" cy="150" r="56" fill="#ffffff" fill-opacity="0.10"/>

  <!-- 流线 -->
  <path d="M0 250 Q 300 180 600 250 T 1200 250" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
  <path d="M0 610 Q 350 540 700 610 T 1200 610" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <!-- 点阵 -->
  <g fill="#ffffff" fill-opacity="0.20">
    <circle cx="120" cy="560" r="5"/>
    <circle cx="160" cy="560" r="5"/>
    <circle cx="200" cy="560" r="5"/>
    <circle cx="240" cy="560" r="5"/>
  </g>

  <!-- 主文字 -->
  <text x="88" y="350" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="118" font-weight="800" fill="#ffffff" fill-opacity="0.96">动态</text>
  <text x="96" y="418" font-family="Arial, Helvetica, sans-serif" font-size="38" letter-spacing="16" fill="#ffffff" fill-opacity="0.62">DYNAMICS</text>
</svg>
