# Render deploy config for the Spring Boot backend (monorepo, backend lives in ./backend)
# Create a Web Service from this file, or create manually and point rootDir to /backend.
services:
  - type: web
    name: portfolio-backend
    runtime: docker
    rootDir: backend
    plan: free
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: STORAGE_MODE
        value: cloudinary
      # The following must be filled in the Render dashboard (they are secret):
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
