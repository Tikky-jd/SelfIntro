spring:
  application:
    name: portfolio-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---- JPA / Datasource are profile-specific (see application-dev / application-prod) ----

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-string-at-least-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h

storage:
  # local | cloudinary
  mode: ${STORAGE_MODE:local}
  upload-dir: ${STORAGE_UPLOAD_DIR:./uploads}
  # Cloudinary credentials (only used when mode=cloudinary)
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin123}

management:
  endpoints:
    web:
      exposure:
        include: health
